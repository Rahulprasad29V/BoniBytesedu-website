<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boni Bytes Blog</title>
<meta name="description" content="Explore AI, programming, career, internships and web development articles from Boni Bytes Edutech.">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Poppins,sans-serif}</style>
</head>
<body class="bg-slate-100">

<header class="bg-slate-900 text-white py-16">
<div class="max-w-6xl mx-auto px-6">
<h1 class="text-5xl font-bold">Boni Bytes Blog</h1>
<p class="mt-4 text-lg text-slate-300">AI • Programming • Careers • Marketing • Web Development</p>

<div class="mt-8">
<input id="search" type="text" placeholder="Search articles..."
class="w-full md:w-96 rounded-lg px-4 py-3 text-black">
</div>
</div>
</header>

<div class="max-w-6xl mx-auto my-8">
<div class="bg-white border-2 border-dashed rounded-xl shadow p-5 text-center">
📢 Top AdSense Banner
</div>
</div>

<main class="max-w-6xl mx-auto px-6">
<div id="grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">

<script>
const posts=[
["AI Tools","ai-tools.html","Discover the best AI tools for productivity."],
["Python Projects","python-projects.html","Hands-on Python project ideas."],
["HTML & CSS Roadmap","html-css-roadmap.html","Learn frontend development."],
["Website Development","website-development.html","Become a full-stack developer."],
["Resume Guide","resume-guide.html","Create an ATS-friendly resume."],
["Internship Guide","internship-guide.html","Find and succeed in internships."],
["Digital Marketing","digital-marketing.html","SEO, social media and analytics."],
["ChatGPT Guide","chatgpt-guide.html","Learn practical ChatGPT skills."],
["AI Career Roadmap","ai-career-roadmap.html","Roadmap to becoming an AI engineer."]
];

const grid=document.currentScript.parentElement;
posts.forEach(p=>{
const card=document.createElement("a");
card.href=p[1];
card.className="block bg-white rounded-2xl shadow hover:shadow-xl transition p-6";
card.innerHTML=`
<div class="inline-block bg-blue-600 text-white text-xs px-3 py-1 rounded-full">Article</div>
<h2 class="text-2xl font-bold mt-4">${p[0]}</h2>
<p class="text-slate-600 mt-3">${p[2]}</p>
<div class="mt-6 text-blue-600 font-semibold">Read Article →</div>`;
grid.appendChild(card);
});

document.getElementById("search").addEventListener("input",e=>{
const q=e.target.value.toLowerCase();
[...grid.children].forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?"block":"none";
});
});
</script>

</div>

<div class="bg-white border-2 border-dashed rounded-xl shadow p-5 text-center my-10">
📢 Bottom AdSense Banner
</div>
</main>

<footer class="bg-slate-900 text-white text-center py-8 mt-10">
© 2026 Boni Bytes Edutech
</footer>

</body>
</html>
